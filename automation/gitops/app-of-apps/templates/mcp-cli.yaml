{{- if .Values.mcpCli.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.mcpCli.name "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  ignoreDifferences:
    # The image trigger rewrites the image to the latest built digest
    - group: apps
      kind: Deployment
      name: mcp-cli
      jsonPointers:
        - /spec/template/spec/containers/0/image
    - group: build.openshift.io
      kind: BuildConfig
      jsonPointers:
        - /spec/failedBuildsHistoryLimit
        - /spec/successfulBuildsHistoryLimit
        - /spec/nodeSelector
        - /spec/postCommit
  destination:
    namespace: {{ .Values.mcpCli.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: {{ .Values.gitops.basePath }}mcp-cli
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        namespace: {{ .Values.mcpCli.namespace }}
        clusterSubdomain: {{ .Values.cluster.subdomain }}
        llm:
          apiUrl: {{ .Values.openshiftAgenticLightspeed.llm.apiUrl | quote }}
          apiKey: {{ .Values.openshiftAgenticLightspeed.llm.apiKey | quote }}
          model: {{ .Values.openshiftAgenticLightspeed.llm.model | quote }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
