---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-central-reencrypt-route
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.reencryptRoute.serviceAccountName | default "central-reencrypt-route-sa" }}
      restartPolicy: Never
      containers:
      - name: create-route
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          NAMESPACE="{{ .Release.Namespace }}"
          ROUTE_NAME="central-reencrypt"
          SERVICE_NAME="central"

          # Wait for central-tls secret
          for i in $(seq 1 60); do
            if oc get secret central-tls -n "${NAMESPACE}" &>/dev/null; then
              break
            fi
            echo "Waiting for central-tls secret... (${i}/60)"
            sleep 5
          done

          # Extract the CA certificate
          DEST_CA=$(oc get secret central-tls -n "${NAMESPACE}" -o jsonpath='{.data.ca\.pem}' | base64 -d)

          # Check if route already exists
          if oc get route "${ROUTE_NAME}" -n "${NAMESPACE}" &>/dev/null; then
            echo "Route ${ROUTE_NAME} already exists, deleting to recreate..."
            oc delete route "${ROUTE_NAME}" -n "${NAMESPACE}"
          fi

          # Create the reencrypt route
          cat <<ROUTEEOF | oc apply -f -
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: ${ROUTE_NAME}
            namespace: ${NAMESPACE}
          spec:
            to:
              kind: Service
              name: ${SERVICE_NAME}
              weight: 100
            port:
              targetPort: https
            tls:
              termination: reencrypt
              insecureEdgeTerminationPolicy: Redirect
              destinationCACertificate: |
          $(echo "${DEST_CA}" | sed 's/^/            /')
          ROUTEEOF

          echo "Reencrypt route created successfully"
  backoffLimit: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.reencryptRoute.serviceAccountName | default "central-reencrypt-route-sa" }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: central-reencrypt-route-role
  annotations:
    argocd.argoproj.io/sync-wave: "9"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: central-reencrypt-route-binding
  annotations:
    argocd.argoproj.io/sync-wave: "9"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: central-reencrypt-route-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.reencryptRoute.serviceAccountName | default "central-reencrypt-route-sa" }}
  namespace: {{ .Release.Namespace }}
